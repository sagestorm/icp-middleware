name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout middleware
        uses: actions/checkout@v4
        with:
          path: icp-middleware

      - name: Checkout protocol (sibling fixtures + schemas)
        uses: actions/checkout@v4
        with:
          repository: sagestorm/interrogative-collection-protocol
          path: interrogative-collection-protocol

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        working-directory: icp-middleware
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (unit + protocol conformance)
        working-directory: icp-middleware
        run: pytest -q
