[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-middleware"
version = "0.1.0"
description = "Reference middleware for the Interrogative Collection Protocol (enforce → quarantine → normalize → blind_export)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "ICP Middleware Contributors" }]
keywords = [
  "interrogative-collection-protocol",
  "icp",
  "blind-review",
  "survey",
  "middleware",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
icp-middleware = "icp_middleware.cli:main"

[project.urls]
Homepage = "https://github.com/sagestorm/icp-middleware"
Repository = "https://github.com/sagestorm/icp-middleware"
Issues = "https://github.com/sagestorm/icp-middleware/issues"
Protocol = "https://github.com/sagestorm/interrogative-collection-protocol"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icp_middleware = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
